let current = 0;
const sums = { e: 0, s: 0, t: 0 };

function $(id) { return document.getElementById(id); }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("show"));
  $(id).classList.add("show");
}

function startQuiz() {
  current = 0;
  sums.e = 0; sums.s = 0; sums.t = 0;
  buildProgress();
  showScreen("screen-quiz");
  renderQuestion();
}

function buildProgress() {
  const row = $("progress-row");
  row.innerHTML = "";
  QUESTIONS.forEach(() => {
    const span = document.createElement("span");
    span.innerHTML = "<i></i>";
    row.appendChild(span);
  });
}

function updateProgress() {
  document.querySelectorAll("#progress-row span").forEach((s, i) => {
    s.classList.remove("done", "active");
    if (i < current) s.classList.add("done");
    if (i === current) s.classList.add("active");
  });
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $("q-count").textContent = `QUESTION ${current + 1} / ${QUESTIONS.length}`;
  $("q-text").textContent = q.text;
  const optsEl = $("options");
  optsEl.innerHTML = "";
  q.opts.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt.label;
    b.onclick = () => selectOption(opt);
    optsEl.appendChild(b);
  });
  updateProgress();
}

function selectOption(opt) {
  sums.e += opt.e; sums.s += opt.s; sums.t += opt.t;
  current += 1;
  if (current < QUESTIONS.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const n = QUESTIONS.length;
  const uv = { e: sums.e / n, s: sums.s / n, t: sums.t / n };

  let best = 0;
  let bestDist = Infinity;
  TEAMS.forEach((team, i) => {
    const d = Math.pow(team.e - uv.e, 2) + Math.pow(team.s - uv.s, 2) + Math.pow(team.t - uv.t, 2);
    if (d < bestDist) { bestDist = d; best = i; }
  });

  const team = TEAMS[best];
  $("r-title").textContent = team.title;
  $("r-sub").textContent = team.sub;
  $("r-desc").textContent = team.desc;
  const traitsEl = $("r-traits");
  traitsEl.innerHTML = "";
  team.traits.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="trait-dot"></span><span>${t}</span>`;
    traitsEl.appendChild(li);
  });
  $("compat-name").textContent = team.compat;
  $("compat-reason").textContent = team.compatReason;
  $("nba-name").textContent = team.nba;
  $("nba-reason").textContent = team.nbaReason;
  window.__resultTeam = team;
  showScreen("screen-result");
}

function restart() { showScreen("screen-start"); }

function showToast(msg) {
  const toast = $("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2400);
}

function shareResult() {
  const team = window.__resultTeam;
  const shareUrl = location.href;
  const text = `【あなたの適正Bリーグチーム診断】\n私にぴったりなのは「${team.title}」でした!\n${team.sub}\nおすすめNBAチームは「${team.nba}」\n\nあなたの適正チームは？(全26クラブから診断)\n${shareUrl}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast("コピーしました。SNSに貼り付けてシェアしよう");
    }).catch(() => { window.prompt("コピーしてSNSに貼り付けてください", text); });
  } else {
    window.prompt("コピーしてSNSに貼り付けてください", text);
  }
}

/* ---- 画像カード生成 ---- */
function wrapByChar(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const ch of text) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

async function buildResultCanvas(team) {
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  const W = 1080, H = 1350;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#14171f");
  bg.addColorStop(1, "#1d2330");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ff7a3d";
  ctx.fillRect(0, 0, W, 14);

  const ML = 72;
  const MW = W - ML * 2;
  let y = 120;

  ctx.fillStyle = "#ff8c52";
  ctx.font = "700 30px 'Zen Kaku Gothic New'";
  ctx.fillText("TEAM CHECK — ALL 26 CLUBS", ML, y);

  y += 56;
  ctx.fillStyle = "#9aa4b2";
  ctx.font = "500 26px 'Zen Kaku Gothic New'";
  ctx.fillText("YOUR TEAM IS", ML, y);

  y += 70;
  ctx.fillStyle = "#ff7a3d";
  ctx.font = "900 76px 'Zen Kaku Gothic New'";
  const titleLines = wrapByChar(ctx, team.title, MW);
  titleLines.forEach(line => { ctx.fillText(line, ML, y); y += 86; });

  y += 4;
  ctx.fillStyle = "#9aa4b2";
  ctx.font = "500 30px 'Noto Sans JP'";
  ctx.fillText(team.sub, ML, y);

  y += 56;
  ctx.strokeStyle = "#2b3340";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(W - ML, y); ctx.stroke();

  y += 56;
  ctx.fillStyle = "#e8ecf2";
  ctx.font = "400 32px 'Noto Sans JP'";
  const descLines = wrapByChar(ctx, team.desc, MW).slice(0, 5);
  descLines.forEach(line => { ctx.fillText(line, ML, y); y += 48; });

  y += 28;
  const boxes = [
    { label: "相性のいいタイプ", value: team.compat, color: "#ff7a3d" },
    { label: "おすすめのNBAチーム", value: team.nba, color: "#34b98c" }
  ];
  boxes.forEach(b => {
    const boxH = 118;
    ctx.fillStyle = "#1a1f29";
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    roundRect(ctx, ML, y, MW, boxH, 16);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = b.color;
    ctx.font = "700 24px 'Zen Kaku Gothic New'";
    ctx.fillText(b.label, ML + 24, y + 42);

    ctx.fillStyle = "#f1f3f7";
    ctx.font = "900 34px 'Zen Kaku Gothic New'";
    ctx.fillText(b.value, ML + 24, y + 88);

    y += boxH + 22;
  });

  ctx.fillStyle = "#6b7482";
  ctx.font = "500 24px 'Noto Sans JP'";
  ctx.textAlign = "center";
  ctx.fillText("あなたの適正Bリーグチーム診断", W / 2, H - 56);
  ctx.textAlign = "left";

  return canvas;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function saveImage() {
  const team = window.__resultTeam;
  showToast("画像を作成しています…");
  let canvas;
  try {
    canvas = await buildResultCanvas(team);
  } catch (e) {
    showToast("画像の作成に失敗しました");
    return;
  }

  canvas.toBlob(async (blob) => {
    if (!blob) { showToast("画像の作成に失敗しました"); return; }
    const fileName = `bleague-diagnosis-${team.title}.png`;
    const file = new File([blob], fileName, { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "あなたの適正Bリーグチーム診断",
          text: `私にぴったりなのは「${team.title}」でした!`
        });
        return;
      } catch (e) {
        /* ユーザーがキャンセルした場合などはダウンロードにフォールバック */
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast("画像を保存しました。SNSアプリで投稿に添付しよう");
  }, "image/png");
}
